<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>多模态理解增强控制台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-wrap">
      <h1>多模态理解增强</h1>
      <span class="subtitle">图片 / 音频 / 视频 · 控制台</span>
    </div>
    <div class="status" id="status-line">加载中…</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview">总览</button>
    <button class="tab-btn" data-tab="config">配置</button>
    <button class="tab-btn" data-tab="logs">插件日志</button>
    <button class="tab-btn" data-tab="env">环境配置</button>
  </nav>

  <main>
    <section class="tab-panel active" id="panel-overview">
      <div class="subtabs" id="overview-subtabs"></div>
      <div class="cards" id="overview-cards"></div>
      <div class="block">
        <div class="block-head"><h2>覆写项</h2></div>
        <ul class="override-list" id="overview-overrides"><li class="muted">—</li></ul>
      </div>
      <div class="block">
        <div class="block-head">
          <h2>最近错误日志</h2>
          <button class="btn small" id="refresh-overview">刷新</button>
        </div>
        <ul class="error-list" id="overview-errors"><li class="muted">暂无</li></ul>
      </div>
    </section>

    <section class="tab-panel" id="panel-config">
      <div class="block">
        <div class="block-head">
          <h2>配置</h2>
          <div class="btn-row">
            <button class="btn" id="reload-config">重新读取</button>
            <button class="btn primary" id="save-config">保存当前页</button>
          </div>
        </div>
        <p class="muted small">默认配置 + 每个 Bot 分页覆写（未覆写的项自动跟随默认）；与 AstrBot 插件配置为同一份文件，双向同步。</p>
        <div class="subtabs" id="config-subtabs"></div>
        <div id="config-body"></div>
      </div>
    </section>

    <section class="tab-panel" id="panel-logs">
      <div class="block">
        <div class="block-head">
          <h2>插件日志</h2>
          <div class="btn-row">
            <button class="btn small" id="logs-refresh">刷新</button>
            <button class="btn small" id="logs-stream-toggle">开启实时流</button>
            <button class="btn small" id="logs-export">导出日志</button>
          </div>
        </div>
        <pre class="log-view" id="log-view">（加载中……）</pre>
      </div>
    </section>

    <section class="tab-panel" id="panel-env">
      <div class="block">
        <div class="block-head">
          <h2>环境检测</h2>
          <div class="btn-row">
            <button class="btn small" id="env-refresh">重新检测</button>
            <button class="btn small" id="env-clean">清理临时文件</button>
          </div>
        </div>
        <div id="env-status" class="env-grid"></div>
      </div>
      <div class="block">
        <div class="block-head">
          <h2>一键配置所有功能依赖</h2>
          <div class="btn-row">
            <button class="btn primary" id="install-all">一键安装（numpy · librosa · scipy · soundfile）</button>
          </div>
        </div>
        <p class="muted small">不检测缺失情况，统一安装全部功能依赖（使用上方配置的 pip 镜像源）；安装期间请勿关闭页面。</p>
        <pre class="install-output" id="install-output">（暂无安装任务）</pre>
      </div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
